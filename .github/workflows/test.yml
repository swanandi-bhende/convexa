name: Test Pipeline

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Run black check
        run: black --check agents/ utils/ keeper/ uniswap/

      - name: Run flake8
        run: flake8 agents/ utils/

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    needs: unit-tests
    env:
      DATABASE_URL: sqlite://
      ORCHESTRATOR_SAFE_MODE: "1"
      MAX_DATA_AGE_SECONDS: "120"
      MAX_CONVICTION_DRIFT_PER_ROUND: "15"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install integration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-timeout

      - name: Run integration tests
        run: pytest tests/integration_test.py -v --tb=long --timeout=300 --junitxml=integration-junit.xml

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-junit
          path: integration-junit.xml

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    needs: integration-tests
    outputs:
      coverage_percent: ${{ steps.coverage_percent.outputs.coverage_percent }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install coverage dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run coverage
        run: |
          pytest tests/ \
            --cov=agents \
            --cov=utils \
            --cov=keeper \
            --cov=uniswap \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Capture coverage percentage
        id: coverage_percent
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          line_rate = float(ET.parse("coverage.xml").getroot().attrib.get("line-rate", 0.0))
          coverage_percent = line_rate * 100.0
          print(f"Coverage: {coverage_percent:.2f}%")
          with open("$GITHUB_OUTPUT", "a", encoding="utf-8") as fh:
              fh.write(f"coverage_percent={coverage_percent:.2f}\n")
          PY

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  pr-summary:
    name: pr-summary
    if: always()
    runs-on: ubuntu-latest
    needs:
      - lint
      - unit-tests
      - integration-tests
      - coverage

    steps:
      - name: Build summary
        id: summary
        run: |
          python - <<'PY'
          import os

          jobs = {
              "lint": os.environ["LINT"],
              "unit-tests": os.environ["UNIT_TESTS"],
              "integration-tests": os.environ["INTEGRATION_TESTS"],
              "coverage": os.environ["COVERAGE"],
          }
          coverage_percent = os.environ.get("COVERAGE_PERCENT", "0.00")

          total = len(jobs)
          passed = sum(1 for result in jobs.values() if result == "success")
          pass_rate = (passed / total) * 100 if total else 0.0

          lines = [
              "### CI Test Summary",
              "",
              f"Pass rate: {passed}/{total} ({pass_rate:.1f}%)",
              f"Coverage: {coverage_percent}%",
              "",
          ]

          for name, result in jobs.items():
              lines.append(f"- {name}: {result}")

          body = "\n".join(lines)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(body + "\n")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write("body<<EOF\n")
              fh.write(body + "\n")
              fh.write("EOF\n")
          PY
        env:
          LINT: ${{ needs.lint.result }}
          UNIT_TESTS: ${{ needs.unit-tests.result }}
          INTEGRATION_TESTS: ${{ needs.integration-tests.result }}
          COVERAGE: ${{ needs.coverage.result }}
          COVERAGE_PERCENT: ${{ needs.coverage.outputs.coverage_percent }}

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SUMMARY_BODY: ${{ steps.summary.outputs.body }}
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const issue_number = context.payload.pull_request.number
            const marker = "<!-- convexa-ci-summary -->"
            const body = `${marker}\n${process.env.SUMMARY_BODY}`

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
            })

            const existing = comments.find((comment) =>
              comment.body && comment.body.includes(marker)
            )

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              })
            }